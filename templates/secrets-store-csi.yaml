{{- if and .Values.platform.secretsStoreCsiDriver.enabled .Values.platform.secretsStoreCsiProviderAws.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ include "repo-explorer-application-config.name" . }}-platform-aws-secrets-store-csi
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
      chart: secrets-store-csi-driver
      targetRevision: {{ .Values.platform.secretsStoreCsiDriver.chartVersion | quote }}
      helm:
        releaseName: csi-secrets-store
        values: |
          tokenRequests:
{{ toYaml .Values.platform.secretsStoreCsiDriver.tokenRequests | nindent 10 }}

    - repoURL: https://aws.github.io/secrets-store-csi-driver-provider-aws
      chart: secrets-store-csi-driver-provider-aws
      targetRevision: {{ .Values.platform.secretsStoreCsiProviderAws.chartVersion | quote }}
      helm:
        releaseName: secrets-provider-aws
        values: |
          secrets-store-csi-driver:
            install: false

  destination:
    server: {{ include "repo-explorer-application-config.target-server" . }}
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
{{- end }}
