      - audience: sts.amazonaws.com
      - audience: pods.eks.amazonaws.com

  secretsStoreCsiProviderAws:
    enabled: true
    chartVersion: 3.1.0

repositories:
  frontend:
    enabled: true
    repoURL: https://github.com/maneishbisht/REPO_EXPLORER_FRONTEND_CONFIG.git
    path: .
    revision: HEAD

  backend:
    enabled: true
    repoURL: https://github.com/maneishbisht/REPO_EXPLORER_BACKEND_CONFIG.git
    path: .
    revision: HEAD
