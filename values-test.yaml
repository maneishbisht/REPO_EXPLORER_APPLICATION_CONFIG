  clusterName: test_cluster
  endpoint: "https://934A4F2119E96595CD70BEAD47EFD0FB.gr7.ap-south-1.eks.amazonaws.com"
  namespace: repo-explorer

aws:
  region: ap-south-1
  vpcId: "vpc-011de9f669cdcd6b7"

serviceAccounts:
  gatewayController: gateway-controller-sa

platform:
  awsLoadBalancerController:
    enabled: true
    chartVersion: 1.14.0
    featureGates:
      ALBGatewayAPI: true
      NLBGatewayAPI: true

  gatewayApi:
    enabled: true
    version: 1.6.0

  secretsStoreCsiDriver:
    enabled: true
    chartVersion: 1.6.0
